services:
  # Spring Boot 应用
  - type: web
    name: codelens-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: AI_BASE_URL
        value: https://api.siliconflow.cn
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        value: https://msb8080.github.io
