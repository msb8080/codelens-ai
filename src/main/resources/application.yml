server:
  port: 8090

spring:
  application:
    name: codelens-ai

  # AI模型配置 (OpenAI 兼容接口)
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://token-plan-cn.xiaomimimo.com}
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:mimo-v2.5-pro}
          temperature: 0.7
          max-tokens: 2048

# CORS 配置（逗号分隔）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://msb8080.github.io,http://localhost:3000,http://localhost:5173,http://localhost:8090}

# Actuator & Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# 日志
logging:
  level:
    com.shuaibo.ai: DEBUG
    org.springframework.ai: INFO
