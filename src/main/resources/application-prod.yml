# 生产环境配置
server:
  port: ${PORT:8090}

spring:
  application:
    name: codelens-ai

  ai:
    openai:
      base-url: ${AI_BASE_URL}
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: ${AI_MODEL:Qwen/Qwen2.5-7B-Instruct}
          temperature: 0.7
          max-tokens: 2048

management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    export:
      prometheus:
        enabled: false

logging:
  level:
    com.shuaibo.ai: INFO
    org.springframework.ai: WARN
