version: '3.8'

services:
  # Spring Boot 应用
  codelens-ai:
    build: .
    container_name: codelens-app
    ports:
      - "8090:8090"
    environment:
      - AI_BASE_URL=${AI_BASE_URL:-https://token-plan-cn.xiaomimimo.com}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-mimo-v2.5-pro}
    restart: unless-stopped
