server:
  port: 8090

spring:
  application:
    name: codelens-ai

  # AI模型配置 (OpenAI 兼容接口)
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.siliconflow.cn}
      api-key: ${AI_API_KEY:sk-xvrssvsidkkjmxikhzgwwesvfayihaztdjhogblfdybphcha}
      chat:
        options:
          model: ${AI_MODEL:Qwen/Qwen2.5-7B-Instruct}
          temperature: 0.7
          max-tokens: 2048

# Qdrant 向量数据库配置
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  collection: ${QDRANT_COLLECTION:codelens-code}
  vector-size: 1536  # embedding维度

# Actuator & Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# 日志
logging:
  level:
    com.shuaibo.ai: DEBUG
    org.springframework.ai: INFO
