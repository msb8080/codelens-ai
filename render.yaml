services:
  # Spring Boot 应用
  - type: web
    name: codelens-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: AI_BASE_URL
        value: https://token-plan-cn.xiaomimimo.com
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: mimo-v2.5-pro
      - key: SPRING_PROFILES_ACTIVE
        value: prod
